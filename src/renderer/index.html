<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Ink & Glow Studio</title>
  <!-- Aplica o tema salvo (escuro/claro) antes de desenhar a página. -->
  <script src="./tema.js"></script>
  <link rel="stylesheet" href="./styles/tema.css">
  <link rel="stylesheet" href="./styles/componentes.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/agenda.css">
</head>
<body>
  <a href="#conteudo" class="sr-only">Pular para o conteúdo</a>
  <div id="app" class="app" hidden>
    <div id="slot-menu"></div>
    <div class="principal">
      <header class="topo">
        <div class="topo__titulo">
          <h1 id="titulo-tela">Ink &amp; Glow Studio</h1>
          <p id="subtitulo-tela"></p>
        </div>
        <div class="usuario">
          <span class="topo__data" id="data-hoje"></span>
          <span id="slot-tema"></span>
          <div class="usuario__avatar" id="usuario-avatar" aria-hidden="true"></div>
          <div>
            <div class="usuario__nome" id="usuario-nome"></div>
            <div class="usuario__perfil" id="usuario-perfil"></div>
          </div>
          <button type="button" class="btn btn--fantasma btn--mini" id="btn-senha">Trocar senha</button>
          <button type="button" class="btn btn--sec btn--mini" id="btn-sair">Sair</button>
        </div>
      </header>
      <main id="conteudo" class="conteudo" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
